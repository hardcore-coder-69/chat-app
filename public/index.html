<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two Person Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <section id="join-screen" class="card">
      <div class="logo">💬</div>
      <h1>Private Chat</h1>
      <p class="subtitle">A simple two-person real-time chat.</p>

      <form id="join-form">
        <label>
          Your name
          <input id="username" maxlength="30" placeholder="e.g. Max" required />
        </label>

        <label>
          Room code
          <input
            id="room-id"
            maxlength="30"
            placeholder="e.g. ABC123"
            autocomplete="off"
            required
          />
        </label>

        <button type="submit">Join Chat</button>
        <p id="join-error" class="error"></p>
      </form>

      <p class="hint">
        Give the same room code to the other person.
      </p>
    </section>

    <section id="chat-screen" class="chat hidden">
      <header class="chat-header">
        <div class="chat-header-left">
          <h2>Private Chat</h2>
          <p id="room-label"></p>
        </div>

        <div class="chat-header-center">
          <div id="receiver-name" class="receiver-name waiting">Waiting for partner...</div>
        </div>

        <div class="chat-header-right">
          <div class="status">
            <span id="status-dot" class="dot offline"></span>
            <span id="status-text">Waiting...</span>
          </div>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <div id="drag-overlay" class="drag-overlay hidden">
        <div class="drag-content">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <p>Drop image to share</p>
        </div>
      </div>

      <div id="typing" class="typing"></div>

      <div id="image-preview-container" class="preview-container hidden">
        <div class="preview-wrapper">
          <img id="image-preview" alt="Preview" />
          <button type="button" id="remove-preview-btn" class="preview-remove" title="Remove image" aria-label="Remove image">&times;</button>
        </div>
        <span class="preview-name" id="preview-filename">image.png</span>
      </div>

      <form id="message-form" class="composer">
        <input type="file" id="image-input" accept="image/*" class="file-input-hidden" />
        <button type="button" id="attach-btn" class="attach-btn" title="Attach Image" aria-label="Attach Image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
        </button>
        <input
          id="message-input"
          maxlength="2000"
          placeholder="Type a message or paste image..."
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Full view" />
      <button id="lightbox-close" class="lightbox-close" title="Close" aria-label="Close">&times;</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
